name: spec-stats

on:
  push:
    branches: [main]
    paths:
      - 'SPEC.md'
      - 'README.md'
      - 'THREAT-MODEL.md'
      - 'axioms/**'
      - 'examples/**'
      - 'comparisons/**'
      - 'governance/**'
      - '.github/workflows/spec-stats.yml'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute spec stats
        id: stats
        # Commit message is passed via env to avoid shell injection (e.g. backticks,
        # multi-line commit messages with shell metacharacters break inline ${{ }} use).
        env:
          COMMIT_MSG_FIRSTLINE: ${{ github.event.head_commit.message }}
        run: |
          # First line of commit message only; safely echo'd as a quoted argument.
          msg_short=$(printf '%s\n' "${COMMIT_MSG_FIRSTLINE}" | head -n 1)

          {
            echo "## HPI spec — stats snapshot"
            echo
            printf 'Commit: `%s` · %s\n' "${GITHUB_SHA:0:8}" "$msg_short"
            echo
            echo "### Files"
            echo
            echo "| File | Lines | Words |"
            echo "|---|---:|---:|"
            for f in README.md SPEC.md THREAT-MODEL.md $(find axioms examples comparisons governance -name '*.md' 2>/dev/null | sort); do
              [[ -f "$f" ]] || continue
              lines=$(wc -l < "$f" | tr -d ' ')
              words=$(wc -w < "$f" | tr -d ' ')
              echo "| \`$f\` | $lines | $words |"
            done
            echo
            echo "### SPEC.md sections"
            echo
            echo "| Section | Word count |"
            echo "|---|---:|"
            awk '
              /^## [0-9]/ {
                if (sec) printf "| %s | %d |\n", sec, words
                sec = $0; words = 0; next
              }
              { words += NF }
              END { if (sec) printf "| %s | %d |\n", sec, words }
            ' SPEC.md
            echo
            total_lines=$(find . -name '*.md' -not -path './.git/*' -not -path './node_modules/*' -print0 2>/dev/null | xargs -0 wc -l 2>/dev/null | tail -1 | awk '{print $1}')
            total_words=$(find . -name '*.md' -not -path './.git/*' -not -path './node_modules/*' -print0 2>/dev/null | xargs -0 wc -w 2>/dev/null | tail -1 | awk '{print $1}')
            file_count=$(find . -name '*.md' -not -path './.git/*' 2>/dev/null | wc -l | tr -d ' ')
            echo "**Repo total:** $total_lines lines, $total_words words across $file_count markdown files."
          } > stats.md

      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: spec-stats
          path: stats.md

      - name: Print to job summary
        run: cat stats.md >> "$GITHUB_STEP_SUMMARY"
