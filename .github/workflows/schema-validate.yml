name: schema-validate

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'examples/**.json'
      - '.github/workflows/schema-validate.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check if schemas exist (v0.1 scope)
        id: gate
        run: |
          if [ -z "$(find schemas -name '*.json' 2>/dev/null)" ]; then
            echo "no_schemas=true" >> $GITHUB_OUTPUT
            echo "::notice::No JSON Schemas in schemas/ yet — this is expected for v0. Validation gate will activate when v0.1 schemas land."
          else
            echo "no_schemas=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.gate.outputs.no_schemas == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jsonschema
        if: steps.gate.outputs.no_schemas == 'false'
        run: pip install jsonschema

      - name: Validate every schema is well-formed JSON Schema 2020-12
        if: steps.gate.outputs.no_schemas == 'false'
        run: |
          set -e
          for schema in schemas/*.json; do
            echo "Validating $schema..."
            python3 -c "
          import json, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open('$schema'))
          Draft202012Validator.check_schema(schema)
          print('  ✓ valid JSON Schema 2020-12')
          "
          done

      - name: Validate worked-example data against its schema (when both exist)
        if: steps.gate.outputs.no_schemas == 'false'
        run: |
          # Future: if examples/*.json exist alongside schemas/*.json with matching names,
          # validate the example data against the schema. Scaffolded; no-op until both exist.
          echo "Example-vs-schema validation gate — activates when examples/<family>.json + schemas/<family>.json both exist."
